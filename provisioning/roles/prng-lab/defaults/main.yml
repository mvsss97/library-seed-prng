---
# Compte des étudiants (identifiants seed / dees fixés dans playbook.yml via user-access)
prng_lab_user: seed
prng_lab_dir: "/home/{{ prng_lab_user }}/lab"

# Validateur des tâches 3 à 5
prng_checker_path: /usr/local/bin/seedlab

# Flags : fournis par la plateforme (variables.yml) via playbook.yml
prng_flag_task1: LocalTask1Flg
prng_flag_task2: LocalTask2Flg
prng_flag_task3: LocalTask3Flg
prng_flag_task4: LocalTask4Flg
prng_flag_task5: LocalTask5Flg

# Retirer au compte étudiant ses droits d'administration (le TP n'en a pas besoin).
# Sur les VM SEED, seed est administrateur et son mot de passe (dees) est public :
# laisser ces droits permettrait de lire le validateur et donc les flags 3 à 5.
prng_remove_admin_rights: true
prng_privileged_groups:
  - sudo
  - admin
  - wheel
  - adm
  - docker
  - lxd
  - disk
  - libvirt
  - systemd-journal
