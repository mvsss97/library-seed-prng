---
# Rôle prng-lab : prépare les 5 tâches du SEED Lab PRNG pour un étudiant.

# ------------------------------------------------------------------ fichiers de départ
- name: Create lab directories
  ansible.builtin.file:
    path: "{{ prng_lab_dir }}/{{ item }}"
    state: directory
    owner: "{{ prng_lab_user }}"
    group: "{{ prng_lab_user }}"
    mode: "0755"
  loop: ["", task1, task2, task3, task4, task5]

- name: Copy lab instructions and SEED source code
  ansible.builtin.copy:
    src: "lab/{{ item }}"
    dest: "{{ prng_lab_dir }}/{{ item }}"
    owner: "{{ prng_lab_user }}"
    group: "{{ prng_lab_user }}"
    mode: "0644"
    force: false          # ne jamais écraser le travail de l'étudiant lors d'un re-provisioning
  loop:
    - README.txt
    - task1/README.txt
    - task1/keygen.c
    - task2/README.txt
    - task3/README.txt
    - task4/README.txt
    - task5/README.txt
    - task5/genkey.c

# ------------------------------------------------------------------ défis personnalisés
# Les flags passent par un fichier root 0600, jamais par la ligne de commande ni par
# l'environnement (sudo journalise la commande complète dans auth.log). Le répertoire
# de construction est supprimé même en cas d'échec.
- name: Build per-sandbox challenges
  block:
    - name: Create private build directory
      ansible.builtin.file:
        path: /root/.prng-build
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy challenge generator and checker source
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/root/.prng-build/{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - build_challenges.py
        - seedlab.c

    - name: Write flags for the generator (root only)
      ansible.builtin.copy:
        dest: /root/.prng-build/flags.json
        content: "{{ {'1': prng_flag_task1, '2': prng_flag_task2, '3': prng_flag_task3, '4': prng_flag_task4, '5': prng_flag_task5} | to_json }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Generate per-sandbox challenges and compile the checker
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /root/.prng-build/build_challenges.py
          - --lab-dir
          - "{{ prng_lab_dir }}"
          - --owner
          - "{{ prng_lab_user }}"
          - --flags-file
          - /root/.prng-build/flags.json
          - --salt-file
          - /root/.prng-lab-salt
          - --checker-src
          - /root/.prng-build/seedlab.c
          - --checker-out
          - "{{ prng_checker_path }}"
      changed_when: true

  always:
    - name: Remove build directory
      ansible.builtin.file:
        path: /root/.prng-build
        state: absent

# ------------------------------------------------------------------ vérifications
- name: Run checker self-test
  ansible.builtin.command: "{{ prng_checker_path }} --selftest"
  register: prng_selftest
  changed_when: false
  no_log: true

- name: Check that the checker contains the flags of this sandbox
  ansible.builtin.assert:
    that:
      - prng_selftest.stdout_lines == [prng_flag_task3 | hash('sha256'), prng_flag_task4 | hash('sha256'), prng_flag_task5 | hash('sha256')]
    fail_msg: "Le validateur seedlab ne contient pas les flags attendus"
    quiet: true
  no_log: true

- name: Check checker permissions
  ansible.builtin.stat:
    path: "{{ prng_checker_path }}"
  register: prng_checker_stat

- name: Assert checker is execute-only for students
  ansible.builtin.assert:
    that:
      - prng_checker_stat.stat.exists
      - prng_checker_stat.stat.mode == '0711'
      - prng_checker_stat.stat.pw_name == 'root'

- name: Check generated challenge files
  ansible.builtin.stat:
    path: "{{ prng_lab_dir }}/{{ item }}"
  register: prng_files
  loop:
    - task1/secret.enc
    - task1/keygen.log
    - task2/alice_tax_return.pdf.enc
    - task2/bob_notes.txt

- name: Assert challenge files exist and belong to the student
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.pw_name == prng_lab_user
    quiet: true
  loop: "{{ prng_files.results }}"
  loop_control:
    label: "{{ item.item }}"

# ------------------------------------------------------------------ anti-triche
# Les étudiants utilisent le compte seed / dees. Sur les VM SEED, ce compte est
# administrateur (sudo, docker...) : avec un mot de passe connu de tous, un étudiant
# deviendrait root et pourrait lire le validateur. On lui retire ces droits ; le compte
# de gestion de la plateforme (mgmt_user : ubuntu) n'est pas modifié.
- name: Remove admin rights from the lab account
  when: prng_remove_admin_rights | bool
  block:
    - name: Refuse to strip the management account
      ansible.builtin.assert:
        that:
          - prng_lab_user != (ansible_user | default('root'))
        fail_msg: "Le compte étudiant ({{ prng_lab_user }}) ne doit pas être le mgmt_user de topology.yml"

    - name: Collect local groups
      ansible.builtin.getent:
        database: group

    - name: Remove the lab account from privileged groups
      ansible.builtin.command:
        argv: [gpasswd, -d, "{{ prng_lab_user }}", "{{ item }}"]
      loop: "{{ prng_privileged_groups }}"
      when:
        - item in ansible_facts.getent_group
        - prng_lab_user in (ansible_facts.getent_group[item][2] | default('', true)).split(',')
      register: prng_group_cleanup
      changed_when: true

    - name: Find sudoers drop-in files
      ansible.builtin.find:
        paths: /etc/sudoers.d
      register: prng_sudoers_files

    - name: Remove sudo rules naming the lab account
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^\s*{{ prng_lab_user }}\s'
        state: absent
        validate: /usr/sbin/visudo -cf %s
      loop: "{{ ['/etc/sudoers'] + (prng_sudoers_files.files | map(attribute='path') | list) }}"
      register: prng_sudoers_cleanup

    # Une session déjà ouverte (connexion graphique automatique) garderait ses anciens groupes
    - name: Close sessions opened with the former rights
      ansible.builtin.command: "pkill -KILL -u {{ prng_lab_user }}"
      register: prng_pkill
      changed_when: prng_pkill.rc == 0
      failed_when: prng_pkill.rc > 1
      when: prng_group_cleanup is changed or prng_sudoers_cleanup is changed
      notify: Restart display manager

    - name: List sudo rights of the lab account
      ansible.builtin.command: "sudo -l -U {{ prng_lab_user }}"
      environment:
        LC_ALL: C
        LANG: C
        LANGUAGE: C
      register: prng_sudo_rights
      changed_when: false
      failed_when: false

    - name: Assert the lab account has no sudo rights
      ansible.builtin.assert:
        that:
          - "'is not allowed to run sudo' in (prng_sudo_rights.stdout + prng_sudo_rights.stderr)"
        fail_msg: "{{ prng_lab_user }} a encore des droits sudo : {{ prng_sudo_rights.stdout }}"

- name: Collect services
  ansible.builtin.service_facts:
